<h1>How Europe markets with Claude: 33 markets through a marketing lens</h1>
<p>An interactive dashboard on how 33 European markets use Claude for marketing work, based on the Anthropic Economic Index. <strong>Enable JavaScript to use the interactive charts.</strong></p>
<h2>Where marketing content gets made</h2>
<p>Ukraine, Cyprus and Malta produce the most marketing and social content as a share of their Claude usage; the Nordics and Luxembourg the least.</p>
<h2>Execution vs strategy</h2>
<p>Ukraine and Malta are the most execution-led. Iceland, Luxembourg and Norway lean hardest toward strategy, planning three to four times more than they produce content.</p>
<h2>The marketing work mix</h2>
<p>Across Europe, email and messaging and written content are the largest marketing outputs, with planning and strategy close behind.</p>
<h2>Adoption, code and automation</h2>
<p>Switzerland leads adoption at about 5.0 times its working-age population share, ahead of Luxembourg (4.9) and Norway (4.0). Markets with deeper adoption spend a smaller share of conversations on software development: Serbia (16.0%) and Ukraine (15.3%) lead, while the highest-adoption markets sit nearer 9%. Only five of 33 markets (Malta, Estonia, Croatia, Ukraine and Slovenia) hand work off to Claude more often than the global average of 48.6%.</p>
<h2>About the data</h2>
<p>Source: the <a href="https://www.anthropic.com/economic-index">Anthropic Economic Index</a>, May 2026 data, covering Claude.ai chat and Cowork usage (Free, Pro and Max). It excludes enterprise API usage and other AI tools. Output and topic labels are inferred from conversation content. Released under CC BY 4.0. These figures describe observed Claude usage, not jobs or the labour market. <a href="/writing/ai-marketing-europe/">Read the findings</a>.</p>
